<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример grid-row и grid-column (Рис. 9.5)</title>
    <style>
        .grid-container {
            display: grid;
            /* Создаем сетку из 3 колонок и 3 строк */
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
            gap: 5px;
            padding: 10px;
        
        }

        .cell {
            background-color: #aaa;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            color: white;
        }

        /* Черная ячейка — занимает 2 строку и 2-3 колонки */
        .black-cell {
            background-color: black;
            grid-row: 2 / 3;   /* Строка 2 (между линиями 2 и 3) */
            grid-column: 2 / 4; /* Колонки 2 и 3 (между линиями 2 и 4) */
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <!-- Ячейки создаются в порядке их появления -->
        <div class="cell">1</div>
        <div class="cell">2</div>
        <div class="cell">3</div>

        <div class="cell">4</div>
        <div class="black-cell">X</div> <!-- Эта ячейка будет черной и занимать 2 строки и 2 колонки -->
        <div class="cell">6</div>

        <div class="cell">7</div>
        <div class="cell">8</div>
    
    </div>
</body>
</html>
