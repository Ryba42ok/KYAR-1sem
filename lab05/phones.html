<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            table {
                empty-cells: hide;
                border-spacing: 0;
                
            }
            caption {
                font-size: 1.2em;
                text-align: center;
            }
            thead th {
                margin: auto;
                border: 2px solid rgb(102, 101, 99);
                width: 100px;
                background-color: #000BFF;
                color: aliceblue;
                text-align: center;
            }
            tbody td {
                margin: auto;
                border: 2px solid rgb(102, 101, 99);
                width: 100px;
                text-align: center;
            }
            tbody td:nth-child(2)
            {
                background-color: darkblue;
                color: aliceblue;
            }
            tbody td:nth-child(3)
            {
                background-color: purple;
                color: aliceblue;
            }
            tbody td:nth-child(4)
            {
                background-color: green;
                color: aliceblue;
            }
            tfoot td {
                text-align: center;
                border: 2px solid rgb(102, 101, 99);
            }
            tfoot td:nth-child(2)
            {
                background-color: darkblue;
                color: aliceblue;
            }
            tfoot td:nth-child(3)
            {
                background-color: purple;
                color: aliceblue;
            }
            tfoot td:nth-child(4)
            {
                background-color: green;
                color: aliceblue;
            }
        </style>
    </head>
    <body>
        <table>
            <caption>Russia: Top smartphone vendors<br>Q1 2021</caption>
            <thead>
                <tr><th></th><th>Vendor</th> <th>Unit <br> Share</th> <th>Annual <br>Growth</th></tr>
            </thead>
            <tbody>
        <tr>
            <td>#1 ↑</td>
            <td>Xiaomi</td>
            <td>32%</td>
            <td>+125%</td>
        </tr>
        <tr>
            <td>#2 ↑</td>
            <td>Samsung</td>
            <td>27%</td>
            <td>+41%</td>
        </tr>
        <tr>
            <td>#3 ↑</td>
            <td>Honor</td>
            <td>10%</td>
            <td>0%</td>
        </tr>
        <tr>
            <td>#4 ↔</td>
            <td>Apple</td>
            <td>9%</td>
            <td>+24%</td>
        </tr>
        <tr>
            <td>#5 ↔</td>
            <td>Realme</td>
            <td>9%</td>
            <td>+682%</td>
        </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td></td> <td>Total</td> <td>82%</td> <td>682%</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
