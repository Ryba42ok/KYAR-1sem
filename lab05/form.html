<!DOCTYPE html>
<html>
    <head>
        <style>
            form {
                margin: auto;
                width: 410px;
                background-color: indigo;
                color: rgba(255, 255, 255, 1);
            }   
            .mainform
            {
                font-size: 1.2em;
                padding-bottom: 20px;
            }
            p {
                margin: 5px;
                /* color: rgba(255, 255, 255, 1); */
            }
            h2 {
                margin-left: 15px;
                padding-top: 20px;
            }
            label {
                display: inline-block   ;
                margin: 0 0 15px 15px;
                width: 170px;
                text-align: left;
                
            }
            input[type="text"], input[type="email"] {
                width: 200px;
                border-radius: 5px;
                background-color: rgba(255, 255, 255, .5);
                box-shadow: inset 0 0 10px rgba(255, 255, 255, .75);
                color: rgba(255, 255, 255, 1);
            }
            .check {
                width: auto;
                margin: 0;
            }
            select {
                vertical-align: top;
            }
            .buttons
            {
                text-align: right;
            }
            input[type="submit"], input[type="reset"] {
                background-color: navy;
                box-shadow:  0 0 4px white;
                margin-right: 15px;
                color:rgba(255, 255, 255, 1);
                padding: 5px 10px 5px 10px;
                border-radius: 5px;
            }
            input[type="text"]:focus {
                background-color: white;
                color: black;
            }
           
        </style>
    </head>
    <body>
    <main>
        <form>
                <h2>Регистрация постоянного клиента</h2>
            <div class="mainform">
                <p><label for="surename">Фамилия: </label>
                <input name="surename" type="text" required/></p>

                <p><label for="name">Имя:</label>
                <input name="name" type="text" required/></p>

                <p><label for="otch">Отчество:</label>
                <input name="otch" type="text" required /></p>
                <p><label for="age">Ваш возраст:</label>
                <input name="age" type="text" required/></p>
                <p>
                <label>Пол:</label>


                <span>
                <input class="check" type="checkbox" name="gender" value="male">
                <label class="check" for="gender">мужской</label>

                <input class="check" type="checkbox" name="gender" value="female">
                <label class="check" for="gender">женский</label>
                </span>
                </p>
                <p><label for="email">Email:</label>
                <input name="email" type="email" required /></p>
                <p><label for="country">Страна проживания:</label>
                <input name="country" type="text" required /></p>

                <p><label for="where">Откуда вы узнали <br> о нас</label>
                <select style="width: 150px; height: 25px;" name="where" name="where">
                    <option value="null">Выберите вариант</option>
                    <option value="1">VK</option>
                    <option value="2">Instagram</option>
                    <option value="3">Одноклассники</option>
                </select></p>

                <p><label for="date" required>Дата заведения:</label>
                <input style="width: 145px; height: 20px;" name="date" type="date"/></p>
                
                
                <p class="buttons">
                    <input type="submit" value="Регистрация"></input> <input type = "reset" value="Отмена"></input>
                </p>
            </div>
            
                
        </form>
    </main>
    <footer>
        <script>

        </script>
    </footer>
    </body>
</html>
