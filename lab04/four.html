<!DOCTYPE html>
<html>
    <head>
<style>
    .first {
        display: inline-block;
        box-sizing: border-box;
        border: 5px solid black;
        width: 110px;
        height: 110px;
        padding: 10px 10px 10px 10px;
        text-align: center;
        
    }
    .second {
        display: inline-block;
        box-sizing: content-box;
        border: 5px solid black;
        width: 80px;
        height: 80px;
        padding: 10px 10px 10px 10px;
        text-align: center;
    }
</style>
    </head>
    <body>
        <div>
            <div class="first">1</div>
            <div class="second">2</div>
        </div>
    </body>
</html>
